<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM Cash - v2.0</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<h1>ATM Cash v2.0</h1>

<div id="calculations">

    <!-- Revolut Section -->
    <section id="revolutCalcPage" class="calc-section">
        <h2>Revolut</h2>
        <div class="calc-summary">
            <div id="lineBeforeFee">0 DKK</div>
            <div id="lineRevolutFee">0 DKK</div>
        </div>
        <div class="totalFeeDisplay"></div>
    </section>

    <!-- Wise Section -->
    <section id="wiseCalcPage" class="calc-section">
        <h2>Wise</h2>
        <div class="calc-summary">
            <div id="wiseLineBeforeFee">0 DKK</div>
            <div id="wiseLineWiseFee">0 DKK</div>
        </div>
        <div class="totalFeeDisplay"></div>
    </section>

    <!-- Flere sektioner kan tilføjes her på samme måde -->
</div>

<script src="../total_fee.js"></script>
</body>
</html>
